services:
  - type: web
    name: proversed-platform
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PROVERSED_DB_PATH
        value: /tmp/proversed.db
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health
